name: Deploy storefront to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/configure-pages@v5
      # Static build: validates the catalog, copies the site, writes the sitemap.
      # Set repository variable TW_API_BASE to your hosted backend URL to go live (otherwise: demo mode).
      - name: Build static site
        run: node scripts/build-pages.js
        env:
          TW_API_BASE: ${{ vars.TW_API_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
