services:
  postgres:
    image: postgres:16-alpine
    container_name: tridentwear-staging-postgres
    restart: unless-stopped
    networks:
      - tridentwear_staging_net
    environment:
      POSTGRES_DB: tridentwear_staging
      POSTGRES_USER: trident_staging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StagingSecurePass2026!}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trident_staging -d tridentwear_staging"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tridentwear-staging-redis
    restart: unless-stopped
    networks:
      - tridentwear_staging_net
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-StagingRedisPass2026!}"]
    volumes:
      - redis_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-StagingRedisPass2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tridentwear-staging-backend
    restart: unless-stopped
    networks:
      - tridentwear_staging_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: staging
      DB_MODE: postgres
      DATABASE_URL: postgresql://trident_staging:${POSTGRES_PASSWORD:-StagingSecurePass2026!}@postgres:5432/tridentwear_staging
      REDIS_URL: redis://:${REDIS_PASSWORD:-StagingRedisPass2026!}@redis:6379/0
      TRUSTED_PROXIES: 127.0.0.1,::1,172.16.0.0/12,10.0.0.0/8
      TRIDENT_JWT_SECRET: ${TRIDENT_JWT_SECRET:-8f8a6c8b4e2d0f1a9b3c5e7d8f0a2b4c6e8d0f1a3b5c7e9d1f3a5b7c9e1d3f5a}
      TRIDENT_SESSION_SECRET: ${TRIDENT_SESSION_SECRET:-4a2b6c8d0e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c3d5e7f9a1b3c5d7e9f1a3b}
      TRIDENT_FBT_SECRET: ${TRIDENT_FBT_SECRET:-1f3a5b7c9e1d3f5a7b9c1d3e5f7a9b1c3d5e7f9a1b3c5d7e9f1a3b5c7e9d1f3a}
      ALLOWED_ORIGINS: http://localhost:8030,http://127.0.0.1:8030,https://staging.tridentwear.in
      ADMIN_EMAIL: admin@tridentwear.in
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-StagingAdminPass2026!}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_test_secret_placeholder}
      WEB_CONCURRENCY: 4
    ports:
      - "127.0.0.1:8030:8000"
    # entrypoint runs `alembic -c /app/alembic.ini upgrade head` (the old command ran
    # from /app/backend where no alembic.ini exists, so staging could not boot).
    command: ["sh", "/app/scripts/docker/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  tridentwear_staging_net:
    driver: bridge

volumes:
  postgres_staging_data:
  redis_staging_data:
